---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  {% if page.thumbnail_credit %}
  <p class="thumbnail-credit">
    Thumbnail: {% include thumbnail-credit.html credit=page.thumbnail_credit %}
  </p>
  {% endif %}

  {% include disqus.html %}
</article>
